services:
  crm-db:
    image: postgres:18-alpine
    container_name: crm-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=crm_db
    ports:
      - "5436:5432"
    volumes:
      - crm_postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crm_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - crm-network

  crm-api:
    build:
      context: ./crm-api
      dockerfile: Dockerfile
    container_name: crm-api
    ports:
      - "5040:5040"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5040
      - ConnectionStrings__PostgresConnection=Host=crm-db;Port=5432;Database=crm_db;Username=postgres;Password=postgres
    depends_on:
      crm-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - crm-network

  crm-web:
    build:
      context: ./crm-web
      dockerfile: Dockerfile
    container_name: crm-web
    ports:
      - "3004:3004"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5040
    depends_on:
      - crm-api
    restart: unless-stopped
    networks:
      - crm-network

volumes:
  crm_postgres_data:

networks:
  crm-network:
    driver: bridge
